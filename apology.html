<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mahal ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(
        180deg,
        #fff5f8,
        #ffe6ee,
        #ffdce8
    );
    overflow:hidden;
    font-family: "Georgia", serif;
    padding:30px;
}

.container{
    text-align:center;
    max-width:800px;
    position:relative;
}

.flower{
    width:280px;
    cursor:pointer;
    transition:transform .3s ease;
    user-select:none;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.15));
}

.flower:hover{
    transform:scale(1.05);
}

.flower.bloom{
    animation:bloom .6s ease;
}

@keyframes bloom{
    0%{transform:scale(1);}
    50%{transform:scale(1.12);}
    100%{transform:scale(1);}
}

.letter{
    margin-top:25px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    color:#5b3b45;
    line-height:1.8;
}

.letter h1{
    color:#ff5e8e;
    margin-bottom:15px;
}

.letter p{
    font-size:18px;
}

.petal{
    position:absolute;
    width:16px;
    height:24px;
    background:linear-gradient(
        180deg,
        #ff9ebd,
        #ff6ea0
    );
    border-radius:50% 50% 50% 50%;
    pointer-events:none;
    z-index:100;
}

@keyframes fly{
    from{
        opacity:1;
        transform:
        translate(0,0)
        rotate(0deg)
        scale(1);
    }

    to{
        opacity:0;
        transform:
        translate(var(--x), var(--y))
        rotate(var(--r))
        scale(.2);
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        src="flower.png"
        class="flower"
        id="flower"
        alt="Flower Bouquet"
    >

    <div class="letter">
        <h1>I sincerely apologize po, Mahal ko ❤️</h1>

        <p>
            Mahal, I know I may have hurt you and I am truly sorry.
            I never meant to cause you pain, and I hope you can forgive me.
        </p>

        <!-- <br>

        <p>
            Thank you for being patient with me, for understanding me,
            and for staying by my side through everything.
            I promise to do better, learn from my mistakes,
            and become someone who deserves your love every day.
        </p> -->

        <br>

        <p>
            Please accept these flowers and my sincerest apology.
            I love you so much, Mahal. 🌷💕
        </p>
    </div>

</div>

<script>
const flower = document.getElementById("flower");

flower.addEventListener("click", () => {

    flower.classList.add("bloom");

    setTimeout(() => {
        flower.classList.remove("bloom");
    }, 600);

    const rect = flower.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    for(let i = 0; i < 35; i++){

        const petal = document.createElement("div");
        petal.classList.add("petal");

        petal.style.left = centerX + "px";
        petal.style.top = centerY + "px";

        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 250;

        const x =
            Math.cos(angle) * distance + "px";

        const y =
            Math.sin(angle) * distance + "px";

        petal.style.setProperty("--x", x);
        petal.style.setProperty("--y", y);
        petal.style.setProperty(
            "--r",
            `${Math.random()*720-360}deg`
        );

        petal.style.animation =
            `fly ${2 + Math.random()*2}s ease-out forwards`;

        document.body.appendChild(petal);

        setTimeout(() => {
            petal.remove();
        }, 4000);
    }
});
</script>

</body>
</html>
